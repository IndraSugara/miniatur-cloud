global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'jetson-node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cloud-cadvisor:8080']
    metric_relabel_configs:
      - source_labels: ['container_label_iaas_instance_id']
        target_label: instance_id
      - source_labels: ['container_label_iaas_owner_id']
        target_label: owner_id
      - source_labels: ['container_label_iaas_name']
        target_label: instance_name
      - source_labels: ['container_label_iaas_type']
        target_label: iaas_type
