events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=monitoring_limit:10m rate=10r/s;

    # Cloudflare Tunnel terminates SSL → internal is always HTTP
    # Map original proto from CF headers, fallback to https
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ""      "https";
    }

    # ── Per-instance wildcard subdomain blocks (MUST come first) ──────
    # Each running instance with an exposed port gets its own .conf file
    # generated by iaas-api and placed in /etc/nginx/ingress/subdomains/
    # e.g.  le-backend.sughara.my.id  →  172.20.x.x:8000
    include /etc/nginx/ingress/subdomains/*.conf;

    # ── Default server (console + API gateway) ────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # ── MinIO Console (sub-path) ─────────────────────────
        location /storage-console/ {
            proxy_pass http://cloud-storage:9001/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Catch MinIO Console SPA asset requests
            proxy_intercept_errors off;
        }

        # Fallback: MinIO Console assets loaded from root path
        # MinIO SPA references /static/js/xxx.js etc without sub-path prefix
        location ~* ^/(static|login|favicon\.ico|manifest\.json|main\.[a-f0-9]+\.js) {
            proxy_pass http://cloud-storage:9001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── MinIO S3 API ─────────────────────────────────────
        location /storage/ {
            proxy_pass http://cloud-storage:9000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Grafana (sub-path) ───────────────────────────────
        location ^~ /monitor/ {
            proxy_pass http://cloud-dashboard:3000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Prometheus ───────────────────────────────────────
        location /metrics/ {
            proxy_pass http://cloud-metrics:9090/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── IaaS API Auth ────────────────────────────────────
        location /api/auth/token {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://iaas-api:8000/auth/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── IaaS API Monitoring (rate-limited) ───────────────
        location /api/monitoring/ {
            limit_req zone=monitoring_limit burst=10 nodelay;
            proxy_pass http://iaas-api:8000/monitoring/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── IaaS API ─────────────────────────────────────────
        location /api/ {
            proxy_pass http://iaas-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            
            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Dynamic Ingress Routes ───────────────────────────
        include /etc/nginx/ingress/*.conf;

        # ── Static files ─────────────────────────────────────
        location ~* \.(js|mjs)$ {
            root /usr/share/nginx/html;
            types { text/javascript js mjs; }
            default_type text/javascript;
            try_files $uri =404;
        }
        location /assets/css/ {
            root /usr/share/nginx/html;
            types { text/css css; }
            default_type text/css;
            try_files $uri =404;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }
    }
}

